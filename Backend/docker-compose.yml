version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waste-classification-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./waste_classification.db
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./waste_classification.db:/app/waste_classification.db
    restart: unless-stopped
